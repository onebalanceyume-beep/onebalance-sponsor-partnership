<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HAPPY KIDS PROJECT パートナー シェアカード</title>
<style>
  :root{
    --red:#DB444C;
    --red-dark:#B8323A;
    --blue:#5BB9CD;
    --navy:#191E2E;
    --gray:#6B6B70;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; width:100%; overflow-x:hidden; }
  body{
    font-family:"Helvetica Neue",Helvetica,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    background:#EDEDED;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  img{ max-width:100%; display:block; }

  /* シェア用カード本体（この枠内をスクリーンショット） */
  .card{
    width:100%; max-width:420px;
    aspect-ratio:4/5;
    background:linear-gradient(160deg,var(--red) 0%, var(--red-dark) 100%);
    border-radius:28px;
    padding:28px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    color:#fff;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:10px; border:2px solid rgba(255,255,255,0.55); border-radius:20px; pointer-events:none;
  }

  .badge{
    background:#fff; color:var(--red); font-weight:700; font-size:12px; letter-spacing:.05em;
    border-radius:999px; padding:7px 18px; margin-top:6px;
  }

  .photo-wrap{
    width:78%; aspect-ratio:4/3; border-radius:18px; overflow:hidden; border:4px solid #fff; margin:14px 0;
    background:repeating-linear-gradient(45deg,#eee,#eee 10px,#f6f6f6 10px,#f6f6f6 20px);
    display:flex; align-items:center; justify-content:center; color:#bbb; font-size:12px; text-align:center;
  }
  .photo-wrap img{ width:100%; height:100%; object-fit:cover; }

  .message{
    text-align:center; font-size:19px; font-weight:700; line-height:1.6; margin:4px 10px;
  }
  .message .accent{ color:#FFE9A8; }

  .company-field{
    margin-top:10px; text-align:center; font-size:15px; font-weight:700;
    background:rgba(255,255,255,0.15); border:1.5px dashed rgba(255,255,255,0.7);
    border-radius:12px; padding:8px 18px; min-width:60%;
    outline:none;
  }
  .company-field:empty::before{ content:"（ここをタップして企業名を入力）"; opacity:.75; font-weight:400; font-size:12.5px; }

  .hashtags{
    font-size:11.5px; opacity:.9; text-align:center; margin-top:8px; line-height:1.6;
  }

  .footer-logo{
    font-size:11px; letter-spacing:.08em; opacity:.85; margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .footer-logo img{ height:30px; width:30px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; }

  /* 操作ガイド（画面には出るが、スクリーンショット範囲外に置く想定） */
  .guide{
    max-width:420px; margin:16px auto 0; text-align:center; font-size:12.5px; color:var(--gray);
  }
</style>
</head>
<body>

  <div>
    <div class="card" id="shareCard">
      <span class="badge">HAPPY KIDS PROJECT PARTNER</span>

      <div class="photo-wrap">
        <img src="kids_photo.jpg" alt="子どもたちのイメージ写真" onerror="this.style.display='none'; this.parentElement.textContent='（子どもたちの写真をここに）';">
      </div>

      <div class="message">
        児童養護施設の子どもたちの<br>
        <span class="accent">「自立」</span>を応援する仲間になりました
      </div>

      <div class="company-field" contenteditable="true" id="companyName"></div>

      <div class="hashtags">#HappyKidsProject</div>

      <div class="footer-logo">
        <img src="happy_kids_logo.png" alt="HAPPY KIDS PROJECT ロゴ" onerror="this.style.display='none';">
        <span>ONE BALANCE BOXING GYM</span>
      </div>
    </div>
  </div>

  <div class="guide">
    上の枠だけをスクリーンショットしてご利用ください。<br>
    企業名の欄はタップすると直接入力できます。
  </div>

</body>
</html>
