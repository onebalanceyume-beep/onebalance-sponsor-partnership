<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>お申し込みありがとうございました｜ワンバランスボクシング大会</title>
<style>
  :root{
    --red:#DB444C;
    --red-dark:#B8323A;
    --blue:#5BB9CD;
    --navy:#191E2E;
    --gray:#6B6B70;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; width:100%; overflow-x:hidden; }
  body{
    font-family:"Helvetica Neue",Helvetica,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    background:#FFFBFA; color:var(--navy); line-height:1.8;
  }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:480px; margin:0 auto; background:#fff; min-height:100vh; }
  @media (min-width:900px){ .wrap{ max-width:560px; box-shadow:0 0 40px rgba(0,0,0,0.06); min-height:auto; margin-top:40px; border-radius:20px; overflow:hidden; } }

  .hero{
    background:linear-gradient(160deg,var(--red) 0%, var(--red-dark) 100%);
    color:#fff; padding:44px 24px 36px; text-align:center; border-bottom:8px solid #fff;
  }
  .hero .check{ font-size:40px; margin-bottom:10px; }
  .hero h1{ font-size:21px; margin:0 0 8px; font-weight:700; }
  .hero p{ font-size:13.5px; margin:0; opacity:.95; }

  section{ padding:30px 24px; }

  .msg{ font-size:14.5px; color:#333; margin-bottom:24px; text-wrap:pretty; }

  .info-box{
    background:#FAFAFA; border:1.5px solid #F1D9DA; border-radius:16px; padding:20px; margin-bottom:20px;
  }
  .info-box .tag{ font-size:11.5px; color:var(--red); font-weight:700; letter-spacing:.05em; margin-bottom:10px; }
  .info-box ul{ margin:0; padding-left:18px; font-size:13.5px; color:#333; }
  .info-box li{ margin-bottom:6px; }

  .note-box{
    background:#FAFAFA; border-radius:12px; padding:14px 16px; font-size:12px; color:var(--gray); margin-top:24px;
  }

  footer{ text-align:center; padding:24px; font-size:11px; color:#aaa; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="check">✓</div>
    <h1>お申し込み・お支払い<br>ありがとうございました</h1>
    <p>ワンバランスボクシング大会<br>スポンサーとしてご協力いただき、心より感謝申し上げます</p>
  </div>

  <section>
    <div class="msg">
      このたびはワンバランスボクシング大会のスポンサーとしてお申し込みいただき、誠にありがとうございます。
    </div>

    <div class="info-box">
      <div class="tag">スポンサー掲載について</div>
      <ul>
        <li>企業名（お名前）を大会のスポンサーボードに掲載いたします</li>
        <li>ジム内にて1年間、掲示いたします</li>
      </ul>
    </div>

    <div class="note-box">
      ※ ご不明な点がございましたら、メール（feel.good.yoshi3@gmail.com）までお気軽にご連絡ください。
    </div>
  </section>

  <div style="text-align:center; padding:0 24px 30px;">
    <a href="onebalance_sponsor_proposal.html" style="font-size:13px; color:var(--gray); text-decoration:underline;">← ホームページに戻る</a>
  </div>

  <footer>ONE BALANCE BOXING GYM</footer>
</div>
</body>
</html>
